; ina219-battery-monitor
;
;   pio run -e esp32dev              ESP32 DevKit, OLED + serial
;   pio run -e nanoatmega328         Arduino Nano (ATmega328P), OLED + serial
;   pio run -e nanoatmega328_serial  Arduino Nano, serial telemetry only
;   pio test -e native               host unit tests (no hardware needed)

[platformio]
default_envs = esp32dev

[env]
monitor_speed = 115200
; The libraries use C++17; the Arduino cores default to gnu++11.
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
build_src_flags = -Wall -Wextra

[oled]
; Pinned display stack. SSD1306_NO_SPLASH drops the Adafruit logo bitmap,
; which saves flash on the Nano.
lib_deps =
    adafruit/Adafruit SSD1306@2.5.13
    adafruit/Adafruit GFX Library@1.11.11
    adafruit/Adafruit BusIO@1.16.2
build_flags = -D BM_ENABLE_OLED=1 -D SSD1306_NO_SPLASH

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
lib_deps = ${oled.lib_deps}
build_flags = ${env.build_flags} ${oled.build_flags}

[env:nanoatmega328]
; Nano with the old bootloader (57600 baud upload). For a board with the new
; bootloader change `board` to nanoatmega328new.
platform = atmelavr@5.1.0
board = nanoatmega328
framework = arduino
lib_deps = ${oled.lib_deps}
build_flags = ${env.build_flags} ${oled.build_flags}

[env:nanoatmega328_serial]
platform = atmelavr@5.1.0
board = nanoatmega328
framework = arduino
build_flags = ${env.build_flags} -D BM_ENABLE_OLED=0

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra
