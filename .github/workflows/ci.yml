name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PLATFORMIO_VERSION: "6.1.18"

jobs:
  native-tests:
    name: Native unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-native-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-native-${{ runner.os }}-
      - name: Install PlatformIO
        run: pip install "platformio==${PLATFORMIO_VERSION}"
      - name: Run unit tests
        run: pio test -e native -v

  firmware:
    name: Build ${{ matrix.environment }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [esp32dev, nanoatmega328, nanoatmega328_serial]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ matrix.environment }}-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ matrix.environment }}-${{ runner.os }}-
      - name: Install PlatformIO
        run: pip install "platformio==${PLATFORMIO_VERSION}"
      - name: Build firmware
        run: pio run -e ${{ matrix.environment }}
      - name: Report firmware size
        run: pio run -e ${{ matrix.environment }} -t size

  python-tools:
    name: Python tools (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: tools/requirements*.txt
      - name: Install dependencies
        run: pip install -r tools/requirements.txt -r tools/requirements-dev.txt
      - name: Lint
        run: |
          ruff check tools
          ruff format --check tools
      - name: Type check
        run: mypy
      - name: Test
        run: pytest
